name: ci-server

on:
  push:
    branches: [main]
    paths: ['server/**', 'docker-compose.yml', '.github/workflows/ci-server.yml']
  pull_request:
    paths: ['server/**', 'docker-compose.yml', '.github/workflows/ci-server.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: drone
          POSTGRES_PASSWORD: drone
          POSTGRES_DB: drone
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U drone -d drone"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://drone:drone@localhost:5432/drone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          tags: drone-sandbox-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
